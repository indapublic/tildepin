name: Bug report
description: Something TildePin does wrong or doesn't do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The log tells most of the story, so please attach it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you pressed, what you expected and what came out instead.
    validations:
      required: true
  - type: textarea
    id: keyboard
    attributes:
      label: Your keyboard
      description: |
        The layout printed on the keys (ISO, ANSI, JIS), which input sources you use, and what the two keys involved do now: the one under Esc and the one left of Z.
        `make keys` prints the virtual keycode of every key you press, which makes this precise.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed TildePin
      options:
        - Disk image (DMG)
        - Homebrew
        - Built from source
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Drag `~/Library/Logs/TildePin.log` here. In Terminal, `open -R ~/Library/Logs/TildePin.log` shows it in Finder. It holds timestamps and the TildePin and macOS versions, nothing else.
      placeholder: Drop the file here or paste its last lines.
    validations:
      required: true
